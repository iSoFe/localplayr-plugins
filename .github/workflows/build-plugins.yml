name: Build plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build every plugin
        run: gradle assembleDebug --no-daemon

      - name: Create the store index
        run: python3 tools/make_index.py "https://raw.githubusercontent.com/${{ github.repository }}/builds"

      - name: Publish to the builds branch
        run: |
          cp -r dist /tmp/dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan builds-publish
          git rm -rf . > /dev/null 2>&1 || true
          cp -r /tmp/dist/. .
          git add -A
          git commit -m "Plugins build ${{ github.run_number }}"
          git push -f origin HEAD:builds
